<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Armored 3D Slab & Refined Portal Centers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030612;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      width: 1200px;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(0, 247, 255, 0.25);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #00f7ff;
      text-transform: uppercase;
    }
    .version-card {
      background: #06091c;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    .version-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .version-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-num {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .badge-tag {
      font-size: 10px;
      font-family: monospace;
      background: rgba(0, 247, 255, 0.12);
      border: 1px solid rgba(0, 247, 255, 0.35);
      color: #7df9ff;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
    .blocks-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
    }
    .portal-styles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .block-cell, .portal-style-cell {
      background: #02040c;
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 10px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .block-label, .portal-style-label {
      font-size: 9px;
      font-family: monospace;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 8px;
      text-align: center;
    }
    canvas {
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🧱 ARMORED 3D SLABS & REFINED PORTAL CENTERS</div>
    <div style="font-size: 11px; font-family: monospace; color: #64748b;">TONE-MATCHED 3D DEPTH · 100% STATIC TITANIUM · HIGH-TECH STARGATE</div>
  </div>

  <!-- CARD 1: COMPLETE 8 BLOCK TYPES (LOCKED BASE) -->
  <div class="version-card">
    <div class="version-header">
      <div class="version-badge">
        <span class="badge-num">ACTIVE IN GAME</span>
        <span class="badge-title">ARMORED 3D SLAB (ALL 8 BLOCK TYPES)</span>
        <span class="badge-tag">TONE-MATCHED BEVELS · ZERO MUDDY BOTTOM</span>
      </div>
    </div>
    <div class="blocks-grid" id="main-blocks-grid"></div>
  </div>

  <!-- CARD 2: REFINED PORTAL CENTER VARIATIONS -->
  <div class="version-card">
    <div class="version-header">
      <div class="version-badge">
        <span class="badge-num">PORTAL REFINEMENT</span>
        <span class="badge-title">PORTAL BLOCK CENTER DESIGN OPTIONS</span>
        <span class="badge-tag">REPLACES CARTOON SWIRL · HIGH-TECH SCI-FI</span>
      </div>
    </div>
    <div class="portal-styles-grid" id="portal-styles-grid"></div>
  </div>

  <script src="./dist/renderBundle.js"></script>
  <script>
    // 1. Render all 8 block types
    const grid = document.getElementById('main-blocks-grid');
    const healths = [1, 2, 3, 4, 5, 6, 7, 8];

    healths.forEach(h => {
      const cell = document.createElement('div');
      cell.className = 'block-cell';

      const labelText = h <= 5 ? `HP ${h}` : h === 6 ? 'TITANIUM (STATIC)' : h === 7 ? 'PORTAL (STARGATE)' : 'EMP';
      cell.innerHTML = `<span class="block-label">${labelText}</span>`;

      const canvas = document.createElement('canvas');
      canvas.width = 120;
      canvas.height = 70;
      const ctx = canvas.getContext('2d');

      const block = {
        index: 0,
        col: 0,
        row: 0,
        x: 0,
        y: 0,
        w: canvas.width,
        h: canvas.height,
        health: h,
        initialHealth: h,
        isDead: false,
        hitAnim: 0,
        counter: 3
      };

      AssetForge.drawBlockWithPreset(ctx, block, 1, { animTick: 2.5, portalCenterStyle: 3 });
      cell.appendChild(canvas);
      grid.appendChild(cell);
    });

    // 2. Render 3 Portal Center Styles
    const portalGrid = document.getElementById('portal-styles-grid');
    const portalStyles = [
      { id: 1, title: 'OPTION 1: QUANTUM STARGATE RING', subtitle: 'Concentric Event Horizon & Cardinal Calipers' },
      { id: 2, title: 'OPTION 2: PULSING COSMIC NEXUS', subtitle: 'Radiant Accretion Flare & Counter-Rotating Rings' },
      { id: 3, title: 'OPTION 3: HEX CYBER APERTURE (ACTIVE IN GAME)', subtitle: 'Segmented Hex Iris & Dimensional Wormhole Eye' }
    ];

    portalStyles.forEach(s => {
      const cell = document.createElement('div');
      cell.className = 'portal-style-cell';
      cell.innerHTML = `
        <span class="portal-style-label" style="color: #38bdf8; font-weight: 900;">${s.title}</span>
        <span style="font-size: 8px; font-family: monospace; color: #64748b; margin-bottom: 8px;">${s.subtitle}</span>
      `;

      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 90;
      const ctx = canvas.getContext('2d');

      const block = {
        index: 0,
        col: 0,
        row: 0,
        x: 0,
        y: 0,
        w: canvas.width,
        h: canvas.height,
        health: 7,
        initialHealth: 7,
        isDead: false,
        hitAnim: 0,
        counter: 3
      };

      AssetForge.drawBlockWithPreset(ctx, block, 1, { animTick: 2.8, portalCenterStyle: s.id });
      cell.appendChild(canvas);
      portalGrid.appendChild(cell);
    });
  </script>
</body>
</html>
