<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block Design Versions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030612;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      width: 1200px;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(0, 247, 255, 0.25);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #00f7ff;
      text-transform: uppercase;
    }
    .version-card {
      background: #06091c;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    .version-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .version-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-num {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .badge-tag {
      font-size: 10px;
      font-family: monospace;
      background: rgba(0, 247, 255, 0.12);
      border: 1px solid rgba(0, 247, 255, 0.35);
      color: #7df9ff;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
    .blocks-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
    }
    .block-cell {
      background: #02040c;
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .block-label {
      font-size: 9px;
      font-family: monospace;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    canvas {
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🧱 3D BLOCK DESIGN OPTIONS (TACTILE & LESS GLOW)</div>
    <div style="font-size: 11px; font-family: monospace; color: #64748b;">TRUE 3D BEVELS · PHYSICAL MATERIALS · NO NEON HAZE</div>
  </div>

  <div id="versions-container"></div>

  <script src="./dist/renderBundle.js"></script>
  <script>
    const container = document.getElementById('versions-container');
    const versions = [1, 2, 3];
    const healths = [1, 2, 3, 4, 5, 6, 7, 8];

    versions.forEach(vId => {
      const meta = AssetForge.BLOCK_PRESET_METADATA[vId];
      const card = document.createElement('div');
      card.className = 'version-card';

      card.innerHTML = `
        <div class="version-header">
          <div class="version-badge">
            <span class="badge-num">OPTION ${vId}</span>
            <span class="badge-title">${meta.name}</span>
            <span class="badge-tag">${meta.tag}</span>
          </div>
        </div>
        <div class="blocks-grid" id="grid-v${vId}"></div>
      `;

      container.appendChild(card);
      const grid = document.getElementById(`grid-v${vId}`);

      healths.forEach(h => {
        const cell = document.createElement('div');
        cell.className = 'block-cell';

        const labelText = h <= 5 ? `HP ${h}` : h === 6 ? 'TITANIUM' : h === 7 ? 'PORTAL' : 'EMP';
        cell.innerHTML = `<span class="block-label">${labelText}</span>`;

        const canvas = document.createElement('canvas');
        canvas.width = 120;
        canvas.height = 70;
        const ctx = canvas.getContext('2d');

        const block = {
          index: 0,
          col: 0,
          row: 0,
          x: 0,
          y: 0,
          w: canvas.width,
          h: canvas.height,
          health: h,
          initialHealth: h,
          isDead: false,
          hitAnim: 0,
          counter: 3
        };

        AssetForge.drawBlockWithPreset(ctx, block, vId, { animTick: 2.5 });

        cell.appendChild(canvas);
        grid.appendChild(cell);
      });
    });
  </script>
</body>
</html>
