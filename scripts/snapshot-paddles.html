<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selected Paddle Chassis & Top Weapon Mount Variants</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030612;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      width: 1200px;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(59, 130, 246, 0.35);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .version-card {
      background: #06091c;
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    .version-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .version-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-num {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .badge-tag {
      font-size: 10px;
      font-family: monospace;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7df9ff;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
    .tier-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .weapons-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .tier-cell, .weapon-cell {
      background: #02040c;
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 12px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tier-label, .weapon-label {
      font-size: 10px;
      font-family: monospace;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 10px;
      text-align: center;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🏓 MECH TITAN DREADNOUGHT (SELECTED DESIGN)</div>
    <div style="font-size: 11px; font-family: monospace; color: #64748b;">ARMORY EVOLUTION & TOP WEAPON MOUNT OPTIONS</div>
  </div>

  <!-- CARD 1: 3 UPGRADE TIERS -->
  <div class="version-card">
    <div class="version-header">
      <div class="version-badge">
        <span class="badge-num">SECTION 1</span>
        <span class="badge-title">ARMORY UPGRADE PROGRESSION</span>
        <span class="badge-tag">TIERS 1 - 3</span>
      </div>
    </div>
    <div class="tier-row" id="tier-row"></div>
  </div>

  <!-- CARD 2: 4 TOP WEAPON MOUNT OPTIONS -->
  <div class="version-card">
    <div class="version-header">
      <div class="version-badge">
        <span class="badge-num">SECTION 2</span>
        <span class="badge-title">TOP WEAPON MOUNT VARIANTS</span>
        <span class="badge-tag">REPLACES RED STALKS</span>
      </div>
    </div>
    <div class="weapons-row" id="weapons-row"></div>
  </div>

  <script src="./dist/renderBundle.js"></script>
  <script>
    // 1. Upgrade Tiers
    const tierRow = document.getElementById('tier-row');
    const tiers = [
      { t: 1, label: 'TIER 1 (BASE PLATING)', widthScale: 0.95, hasLaser: false },
      { t: 2, label: 'TIER 2 (REINFORCED + THRUSTERS)', widthScale: 1.05, hasLaser: false },
      { t: 3, label: 'TIER 3 (APEX OVERDRIVE + DEFLECTOR)', widthScale: 1.15, hasLaser: false },
    ];

    tiers.forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'tier-cell';
      cell.innerHTML = `<span class="tier-label">${item.label}</span>`;

      const canvas = document.createElement('canvas');
      canvas.width = 360;
      canvas.height = 75;
      const ctx = canvas.getContext('2d');

      const pw = 240 * item.widthScale;
      const ph = 40;
      const paddle = {
        x: canvas.width / 2,
        y: (canvas.height - ph) / 2 + 6,
        width: pw,
        height: ph,
        targetX: canvas.width / 2,
        vx: 0
      };

      AssetForge.drawPaddleWithPreset(ctx, paddle, 1, {
        animTick: 2.8,
        hasLaser: item.hasLaser,
        hasShield: true,
        tier: item.t,
        weaponVariant: 1
      });

      cell.appendChild(canvas);
      tierRow.appendChild(cell);
    });

    // 2. Weapon Mount Variants
    const weaponRow = document.getElementById('weapons-row');
    const weapons = [
      { id: 1, label: 'V1: INTEGRATED RAIL TURRETS', tag: 'ACCELERATOR RAILS' },
      { id: 2, label: 'V2: TWIN HEX MISSILE PODS', tag: 'HONEYCOMB CELLS' },
      { id: 3, label: 'V3: AERODYNAMIC PLASMA BLASTERS', tag: 'FORWARD STRIKE' },
      { id: 4, label: 'V4: CONCEALED STEALTH EMITTERS', tag: 'CLEAN FLUSH TOP' },
    ];

    weapons.forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'weapon-cell';
      cell.innerHTML = `<span class="weapon-label">${item.label}</span>`;

      const canvas = document.createElement('canvas');
      canvas.width = 270;
      canvas.height = 80;
      const ctx = canvas.getContext('2d');

      const pw = 210;
      const ph = 38;
      const paddle = {
        x: canvas.width / 2,
        y: (canvas.height - ph) / 2 + 10,
        width: pw,
        height: ph,
        targetX: canvas.width / 2,
        vx: 0
      };

      AssetForge.drawPaddleWithPreset(ctx, paddle, 1, {
        animTick: 2.8,
        hasLaser: true,
        hasShield: false,
        tier: 2,
        weaponVariant: item.id
      });

      cell.appendChild(canvas);
      weaponRow.appendChild(cell);
    });
  </script>
</body>
</html>
