<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Power-Up Design Versions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030612;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      width: 1200px;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(245, 158, 11, 0.35);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fbbf24;
      text-transform: uppercase;
    }
    .version-card {
      background: #06091c;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    .version-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .version-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-num {
      background: #0f172a;
      border: 1px solid #f59e0b;
      color: #fbbf24;
      font-family: monospace;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .badge-tag {
      font-size: 10px;
      font-family: monospace;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
    .powerups-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }
    .powerup-cell {
      background: #02040c;
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 10px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .powerup-label {
      font-size: 9px;
      font-family: monospace;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 8px;
      text-align: center;
    }
    canvas {
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">TRANSPARENT ROTATING TRIANGLE POWER-UPS</div>
    <div style="font-size: 11px; font-family: monospace; color: #64748b;">3D/2D ROTATING TRIANGLE FRAMES · ORBITING SPARK SATELLITES · 100% TRANSPARENT BODIES</div>
  </div>

  <div id="powerups-container"></div>

  <script src="./dist/renderBundle.js"></script>
  <script>
    const container = document.getElementById('powerups-container');
    const versions = [1];
    const types = ['multiball', 'megaball', 'laser', 'slowmo', 'shield', 'expand'];

    versions.forEach(vId => {
      const meta = AssetForge.POWERUP_PRESET_METADATA[vId];
      const card = document.createElement('div');
      card.className = 'version-card';

      card.innerHTML = `
        <div class="version-header">
          <div class="version-badge">
            <span class="badge-num">OPTION ${vId}</span>
            <span class="badge-title">${meta.name}</span>
            <span class="badge-tag">${meta.tag}</span>
          </div>
        </div>
        <div class="powerups-grid" id="powerup-grid-${vId}"></div>
      `;

      container.appendChild(card);
      const grid = document.getElementById(`powerup-grid-${vId}`);

      types.forEach(t => {
        const cfg = AssetForge.POWER_UP_CONFIGS[t];
        const cell = document.createElement('div');
        cell.className = 'powerup-cell';
        const label = cfg ? cfg.label : t.toUpperCase();
        cell.innerHTML = `<span class="powerup-label">${label}</span>`;

        const canvas = document.createElement('canvas');
        canvas.width = 110;
        canvas.height = 110;
        const ctx = canvas.getContext('2d');

        const drop = {
          id: 1,
          x: canvas.width / 2,
          y: canvas.height / 2,
          vy: 0,
          meta: cfg,
          collected: false,
          angle: 1.8
        };

        AssetForge.drawPowerUpWithPreset(ctx, drop, vId, {
          animTick: 2.2,
          scale: 1.35
        });

        cell.appendChild(canvas);
        grid.appendChild(cell);
      });
    });
  </script>
</body>
</html>
