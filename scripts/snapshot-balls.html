<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ball 3D Design Versions & Upgrades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030612;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      width: 1200px;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(0, 247, 255, 0.35);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #00f7ff;
      text-transform: uppercase;
    }
    .version-card {
      background: #06091c;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    .version-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .version-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-num {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .badge-tag {
      font-size: 10px;
      font-family: monospace;
      background: rgba(0, 247, 255, 0.12);
      border: 1px solid rgba(0, 247, 255, 0.35);
      color: #7df9ff;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
    .balls-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }
    .ball-cell {
      background: #02040c;
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 10px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ball-label {
      font-size: 10px;
      font-family: monospace;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 8px;
      text-align: center;
    }
    canvas {
      display: block;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🔮 3D BALL DESIGN VERSIONS & UPGRADE TIERS</div>
    <div style="font-size: 11px; font-family: monospace; color: #64748b;">STRICTLY INTERNAL 3D EFFECTS · ZERO OUTSIDE PARTICLES</div>
  </div>

  <div id="balls-container"></div>

  <script src="./dist/renderBundle.js"></script>
  <script>
    const container = document.getElementById('balls-container');
    const palettes = [
      { name: 'CYAN', glow: '#00f7ff', c1: '#ffffff', c2: '#7df9ff', c3: '#0055ff' },
      { name: 'FIRE', glow: '#ff5500', c1: '#ffffff', c2: '#ff9900', c3: '#ff0055' },
      { name: 'VOID', glow: '#c084fc', c1: '#ffffff', c2: '#e879f9', c3: '#7c3aed' },
      { name: 'GOLD', glow: '#ffd700', c1: '#ffffff', c2: '#fef08a', c3: '#eab308' },
    ];

    // Card 1: Locked Option 1 Evolution across Tiers 1-3 & Mega Core
    const meta = AssetForge.BALL_PRESET_METADATA[1];
    const tierCard = document.createElement('div');
    tierCard.className = 'version-card';
    tierCard.innerHTML = `
      <div class="version-header">
        <div class="version-badge">
          <span class="badge-num">ACTIVE SELECTION</span>
          <span class="badge-title">${meta.name} — UPGRADE EVOLUTION</span>
          <span class="badge-tag">${meta.tag}</span>
        </div>
      </div>
      <div class="balls-grid" id="tier-balls-grid"></div>
    `;
    container.appendChild(tierCard);

    const tierGrid = document.getElementById('tier-balls-grid');
    const tierItems = [
      { label: 'TIER 1: PROTO CORE', tier: 1, pal: palettes[0], isMega: false },
      { label: 'TIER 2: FUSION CORE', tier: 2, pal: palettes[0], isMega: false },
      { label: 'TIER 3: APEX SPHERE', tier: 3, pal: palettes[0], isMega: false },
      { label: 'TIER 1 (MEGA OVERDRIVE)', tier: 1, pal: palettes[3], isMega: true },
      { label: 'TIER 2 (MEGA OVERDRIVE)', tier: 2, pal: palettes[3], isMega: true },
      { label: 'TIER 3 (MEGA OVERDRIVE)', tier: 3, pal: palettes[3], isMega: true },
    ];

    tierItems.forEach(it => {
      const cell = document.createElement('div');
      cell.className = 'ball-cell';
      cell.innerHTML = `<span class="ball-label">${it.label}</span>`;

      const canvas = document.createElement('canvas');
      canvas.width = 110;
      canvas.height = 110;
      const ctx = canvas.getContext('2d');

      const radius = it.isMega ? 38 : 34;
      const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius,
        isMega: it.isMega
      };

      AssetForge.drawBallWithPreset(ctx, ball, 1, {
        animTick: 2.4,
        tier: it.tier,
        palette: it.pal,
        isMega: it.isMega
      });

      cell.appendChild(canvas);
      tierGrid.appendChild(cell);
    });

    // Card 2: Elemental Resonance Palettes (Apex Tier 3)
    const palCard = document.createElement('div');
    palCard.className = 'version-card';
    palCard.innerHTML = `
      <div class="version-header">
        <div class="version-badge">
          <span class="badge-num">ELEMENTAL PALETTES</span>
          <span class="badge-title">3D STARDUST CHROMATIC SPECTRUM</span>
          <span class="badge-tag">TIER 3 APEX LEVEL</span>
        </div>
      </div>
      <div class="balls-grid" id="palette-balls-grid" style="grid-template-columns: repeat(4, 1fr);"></div>
    `;
    container.appendChild(palCard);

    const palGrid = document.getElementById('palette-balls-grid');
    palettes.forEach(pal => {
      const cell = document.createElement('div');
      cell.className = 'ball-cell';
      cell.innerHTML = `<span class="ball-label">${pal.name} SPECTRUM</span>`;

      const canvas = document.createElement('canvas');
      canvas.width = 110;
      canvas.height = 110;
      const ctx = canvas.getContext('2d');

      const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 34,
        isMega: false
      };

      AssetForge.drawBallWithPreset(ctx, ball, 1, {
        animTick: 2.4,
        tier: 3,
        palette: pal,
        isMega: false
      });

      cell.appendChild(canvas);
      palGrid.appendChild(cell);
    });
  </script>
</body>
</html>
