<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary Metadata -->
    <title>Breakout Ball // Cyberpunk Neon Arcade</title>
    <meta name="title" content="Breakout Ball // Cyberpunk Neon Arcade" />
    <meta name="description" content="Next-generation cyberpunk breakout ball arcade game featuring 30 campaign sectors, route firewalls, community level studio, global arena, and live leaderboards." />
    <meta name="keywords" content="breakout, arcade, breakout ball, cyberpunk, neon, brick breaker, retro arcade, level editor, arena" />
    <meta name="author" content="@elsesourav" />
    <meta name="theme-color" content="#060713" />
    <meta name="color-scheme" content="dark" />

    <!-- Web App & Mobile Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Breakout Ball" />
    <meta name="application-name" content="Breakout Ball" />

    <!-- Icons & Favicon (Fiery Comet Breakout Ball Logo) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Breakout Ball" />
    <meta property="og:title" content="Breakout Ball // Cyberpunk Neon Arcade" />
    <meta property="og:description" content="Shatter plasma cores, breach route firewalls, and conquer custom community levels in Breakout Ball." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Breakout Ball Fiery Comet Logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@elsesourav" />
    <meta name="twitter:title" content="Breakout Ball // Cyberpunk Neon Arcade" />
    <meta name="twitter:description" content="Shatter plasma cores, breach route firewalls, and conquer custom community levels in Breakout Ball." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Google Cyber Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background:#050714;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;user-select:none;z-index:99999;">
        <div style="position:relative;margin-bottom:20px;display:flex;align-items:center;justify-content:center;">
          <img src="/logo.png" alt="Breakout Ball" style="width:96px;height:96px;border-radius:24px;border:2px solid rgba(0,247,255,0.7);box-shadow:0 0 35px rgba(245,158,11,0.45),0 0 65px rgba(0,247,255,0.35);object-fit:cover;" />
        </div>
        <div style="font-size:24px;font-weight:900;letter-spacing:0.15em;background:linear-gradient(90deg,#00f7ff,#38bdf8,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
          BREAKOUT BALL
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.3em;color:rgba(0,247,255,0.8);margin-top:8px;margin-bottom:24px;">
          CYBERPUNK NEON ARCADE
        </div>
        <div style="width:240px;height:6px;background:rgba(0,0,0,0.6);border:1px solid rgba(0,247,255,0.3);border-radius:9999px;overflow:hidden;position:relative;">
          <div style="height:100%;width:35%;background:linear-gradient(90deg,#00f7ff,#38bdf8,#fbbf24);border-radius:9999px;box-shadow:0 0 12px #00f7ff;animation:pulseBar 1.2s ease-in-out infinite alternate;"></div>
        </div>
        <style>
          @keyframes pulseBar {
            0% { width: 15%; opacity: 0.7; }
            100% { width: 85%; opacity: 1; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
