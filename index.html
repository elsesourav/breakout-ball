<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <!-- Primary Metadata -->
    <title>Breakout Ball • Cyberpunk Neon Arcade</title>
    <meta name="title" content="Breakout Ball • Cyberpunk Neon Arcade" />

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Canonical Link -->
    <link rel="canonical" href="/" />

    <!-- Open Graph / Social Sharing (Facebook, Discord, WhatsApp, LinkedIn) -->
    <meta property="og:site_name" content="Breakout Ball" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Breakout Ball • Cyberpunk Neon Arcade" />
    <meta property="og:description" content="Next-generation cyberpunk breakout ball arcade game featuring 100 campaign levels across 10 sectors, route firewalls, community level studio, global arena, and live leaderboards." />

    <meta name="twitter:site" content="@elsesourav" />
    <meta name="twitter:creator" content="@elsesourav" />
    <meta name="twitter:title" content="Breakout Ball • Cyberpunk Neon Arcade" />

    <meta name="twitter:image:alt" content="Breakout Ball Cyberpunk Neon Arcade Banner" />

    <!-- Structured Data (JSON-LD) for Search Engines & Link Crawlers -->
    <script id="schema-page-meta" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Breakout Ball",
      "alternateName": "Breakout Ball • Cyberpunk Neon Arcade",
      "description": "Next-generation cyberpunk breakout arcade game featuring 100 campaign levels across 10 sectors, route firewalls, community level studio, global arena, and live leaderboards.",
      "genre": ["Arcade", "Action", "Puzzle"],
      "playMode": "SinglePlayer",
      "applicationCategory": "Game",
      "operatingSystem": "Web Browser, iOS, Android, macOS, Windows",
      "author": {
        "@type": "Person",
        "name": "elsesourav"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Google Cyber Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background:#030408;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;user-select:none;z-index:99999;">
        <div style="width:80px;height:80px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);box-shadow:0 10px 30px rgba(0,0,0,0.8);margin-bottom:20px;">
          <img src="/logo.png" alt="Breakout Ball" style="width:100%;height:100%;object-fit:cover;" />
        </div>
        <div style="font-size:20px;font-weight:900;letter-spacing:0.12em;color:#ffffff;margin-bottom:4px;">
          BREAKOUT BALL
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:0.25em;color:rgba(0,247,255,0.7);margin-bottom:28px;">
          CYBERPUNK NEON ARCADE
        </div>
        <div style="width:192px;height:4px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;">
          <div style="height:100%;width:35%;background:linear-gradient(90deg,#00f7ff,#0284c7);border-radius:9999px;box-shadow:0 0 10px rgba(0,247,255,0.5);animation:simpleBar 1.2s ease-in-out infinite alternate;"></div>
        </div>
        <div style="font-family:monospace;font-size:12px;color:#94a3b8;margin-top:10px;letter-spacing:0.05em;">
          Loading...
        </div>
        <style>
          @keyframes simpleBar {
            0% { width: 15%; }
            100% { width: 85%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
