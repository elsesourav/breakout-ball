<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Radiant spherical 3D ball gradient -->
    <radialGradient id="breakoutSphere" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f7ff" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Warm energy core variant -->
    <radialGradient id="energyCore" cx="36%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffb703" />
      <stop offset="65%" stop-color="#fb8500" />
      <stop offset="88%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#590d22" />
    </radialGradient>

    <!-- Cyber aura soft glow filter -->
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient atmospheric pulse aura (Centered) -->
  <circle cx="32" cy="32" r="26" fill="#00f7ff" opacity="0.18" filter="url(#softGlow)" />

  <!-- High-tech cyan orbital reticle ring -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#00f7ff" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.65" />

  <!-- Main 3D Spherical Breakout Ball (Centered, No Background, No Fire Streamers) -->
  <circle cx="32" cy="32" r="22" fill="url(#energyCore)" filter="url(#softGlow)" />

  <!-- Inner Cyber Energy Flux Ring -->
  <ellipse cx="32" cy="32" rx="21.5" ry="7.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.45" transform="rotate(-20 32 32)" />

  <!-- Specular 3D Glass Light Reflections -->
  <ellipse cx="25" cy="23" rx="6.5" ry="3.8" transform="rotate(-30 25 23)" fill="#ffffff" opacity="0.9" />
  <circle cx="21" cy="27" r="1.4" fill="#ffffff" opacity="0.75" />

  <!-- Core Neon Plasma Sparkles -->
  <circle cx="48" cy="18" r="1.6" fill="#00f7ff" />
  <circle cx="50" cy="42" r="1.3" fill="#ffb703" />
  <circle cx="15" cy="44" r="1.4" fill="#00f7ff" />
</svg>
