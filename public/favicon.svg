<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1735" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>
    <linearGradient id="comet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#00f7ff" />
    </linearGradient>
    <radialGradient id="ballGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ff9900" />
      <stop offset="90%" stop-color="#ff2200" />
      <stop offset="100%" stop-color="#990000" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base chassis -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#00f7ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Orbital grid lines -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#00f7ff" stroke-opacity="0.15" stroke-dasharray="3,3" />

  <!-- Comet Tail Streamers -->
  <path d="M12 50 Q 24 40 34 28" stroke="url(#comet)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M16 54 Q 28 44 38 32" stroke="#ff0055" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M8 46 Q 20 36 30 24" stroke="#ffaa00" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Fiery Breakout Ball -->
  <circle cx="38" cy="24" r="13" fill="#ff4400" filter="url(#glow)" opacity="0.8"/>
  <circle cx="38" cy="24" r="11" fill="url(#ballGlow)"/>
  <!-- Specular highlight -->
  <ellipse cx="35" cy="20" rx="3.5" ry="2" fill="#ffffff" opacity="0.85"/>

  <!-- Neon cyber sparkles -->
  <circle cx="50" cy="14" r="1.5" fill="#00f7ff"/>
  <circle cx="55" cy="28" r="1.2" fill="#ffaa00"/>
  <circle cx="26" cy="40" r="1.4" fill="#ff0077"/>
</svg>